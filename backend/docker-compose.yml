version: "3.8"

services:

  # ── Backend Flask ────────────────────────────────────────────────────────────
  backend:
    build: .
    container_name: rag-backend
    ports:
      - "5005:5000"
    volumes:
      - ./uploads:/app/uploads        # Excel persistente entre reinicios
    environment:
      SECRET_KEY: "${SECRET_KEY:-dev-secret-key-cambiar-en-produccion}"
      OLLAMA_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3}"
      RAG_TOP_K: "${RAG_TOP_K:-100}"
      RAG_LISTADO_MAX: "${RAG_LISTADO_MAX:-500}"
      UPLOAD_FOLDER: "/app/uploads"
      # Permite llamadas desde el frontend en dev y en prod
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://frontend:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama corriendo en el host
    restart: unless-stopped

  # ── Frontend React/Vite ──────────────────────────────────────────────────────
