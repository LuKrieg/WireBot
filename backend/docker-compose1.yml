version: "3.8"
services:
  rag-excel:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./datos_enerwire.xlsx:/app/datos_enerwire.xlsx   # monta tu Excel sin reconstruir
    extra_hosts:
      - "host.docker.internal:host-gateway"  # para llegar a Ollama en el host
    restart: unless-stopped
